# BuyBot + Evolution API (con Postgres y Redis). Copia .env.example a .env y define las claves.
services:
  buybot:
    build: .
    restart: unless-stopped
    ports: ["8787:8787"]
    environment:
      EVOLUTION_API_URL: http://evolution:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:?define EVOLUTION_API_KEY}
      PUBLIC_WEBHOOK_URL: http://buybot:8787
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TZ: America/Lima
    volumes: ["buybot-data:/data"]
    depends_on: [evolution]

  evolution:
    image: atendai/evolution-api:v2.2.3
    restart: unless-stopped
    environment:
      SERVER_URL: http://evolution:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${POSTGRES_PASSWORD:-evolution}@postgres:5432/evolution
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_LOCAL_ENABLED: "false"
      WEBHOOK_GLOBAL_ENABLED: "false"
    volumes: ["evolution-instances:/evolution/instances"]
    depends_on: [postgres, redis]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evolution}
      POSTGRES_DB: evolution
    volumes: ["pg-data:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes: ["redis-data:/data"]

volumes: { buybot-data: {}, evolution-instances: {}, pg-data: {}, redis-data: {} }
